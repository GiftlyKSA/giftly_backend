# Local development stack. The credentials below are intentionally predictable and
# must not be reused for a deployed environment.

x-app-environment: &app-environment
  ENVIRONMENT: development
  DEBUG: "true"
  LOG_LEVEL: INFO
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/safegift
  REDIS_URL: redis://:changeme@redis:6379/0
  JWT_SECRET: ${JWT_SECRET:-local-development-jwt-secret-change-me}
  JWT_ALGORITHM: HS256
  # Base64-encoded 32-byte development-only key.
  FIELD_ENCRYPTION_KEYS: '{"1":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="}'
  FIELD_ENCRYPTION_KEY_VERSION: "1"
  IDENTITY_FINGERPRINT_PEPPER: ${IDENTITY_FINGERPRINT_PEPPER:-local-development-identity-pepper-change-me}
  ADMIN_DASHBOARD_ENABLED: "true"
  ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
  ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-local-development-admin-session-secret-change-me}
  FORWARDED_ALLOW_IPS: 127.0.0.1
  RATE_LIMIT_ENABLED: "true"

x-app-service: &app-service
  image: safe-gift-backend:local
  build:
    context: .
  environment: *app-environment
  init: true
  restart: unless-stopped

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: safegift
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d safegift"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "changeme"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "changeme", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *app-service
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app-service
    command:
      - uvicorn
      - app.main:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./app:/app/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app-service
    command: ["taskiq", "worker", "app.workers.broker:broker"]
    volumes:
      - ./app:/app/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
