{% extends "base.html" %}
{% block content %}
<h1>User</h1>
{% if not user %}<p>Not found.</p>{% else %}
<section class="card"><table>
  <tr><td>ID</td><td>{{ user.id }}</td></tr>
  <tr><td>Role</td><td>{{ user.role }}</td></tr>
  <tr><td>Status</td><td>{{ user.status }}</td></tr>
  <tr><td>Rating</td><td>{{ user.rating }} ({{ user.rating_count }})</td></tr>
</table></section>
<div class="actions">
  <form method="post" action="/admin/users/{{ user.id }}/ban">
    <input type="hidden" name="csrf_token" value="{{ ctx.csrf_token }}"><button type="submit" class="danger">Ban</button></form>
  <form method="post" action="/admin/users/{{ user.id }}/unban">
    <input type="hidden" name="csrf_token" value="{{ ctx.csrf_token }}"><button type="submit">Unban</button></form>
  <form method="post" action="/admin/step-up/request">
    <input type="hidden" name="next" value="/admin/users/{{ user.id }}"><button type="submit">Step-up</button></form>
</div>
{% endif %}
{% endblock %}
