{% extends "base.html" %}
{% block content %}
<section class="card narrow">
  <h1>Admin sign in</h1>
  {% if stage == "phone" %}
  <form method="post" action="/admin/login">
    <label>Phone<input name="phone" type="tel" placeholder="+9665........" required></label>
    <button type="submit">Send code</button>
  </form>
  {% else %}
  <form method="post" action="/admin/login/verify">
    <input type="hidden" name="phone" value="{{ phone }}">
    <label>Code<input name="otp" inputmode="numeric" autocomplete="one-time-code" required></label>
    <button type="submit">Verify</button>
  </form>
  {% if dev_code %}<p class="dev">Development OTP: <code>{{ dev_code }}</code></p>{% endif %}
  {% endif %}
</section>
{% endblock %}
