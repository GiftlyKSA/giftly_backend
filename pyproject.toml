[project]
name = "safe-gift-backend"
version = "0.1.0"
description = "SAFE-GIFT — peer-to-peer custom gifting marketplace backend."
readme = "README.md"
# SPEC SECTION 2 mandates Python 3.13+. This build environment cannot download a
# 3.13 interpreter (egress policy blocks python-build-standalone), so the floor is
# relaxed to 3.11 here. See DECISIONS.md. Production images should pin 3.13.
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "gunicorn>=23",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "geoalchemy2>=0.16",
    "jinja2>=3.1",
    "cryptography>=44",
    "pyjwt>=2.10",
    "redis[hiredis]>=5.2",
    "httpx>=0.28",
    "taskiq>=0.11",
    "taskiq-redis>=1.0",
    "aioboto3>=13",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
# Nothing runtime-optional yet; extras reserved for deployment-specific pins.

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6",
    "pytest-xdist>=3.6",
    "freezegun>=1.5",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "testcontainers>=4.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "N", "D", "ASYNC", "S", "C90"]
ignore = [
    "D203",  # conflicts with D211
    "D213",  # conflicts with D212
    "S101",  # asserts are used deliberately for money invariants
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "S", "B"]
"app/migrations/*" = ["D", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are called in argument defaults by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Form", "fastapi.Header"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["app.services.*", "app.repositories.*", "app.core.*"]
strict = true

[[tool.mypy.overrides]]
module = ["geoalchemy2.*", "taskiq_redis.*", "aioboto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
omit = ["app/migrations/*"]
