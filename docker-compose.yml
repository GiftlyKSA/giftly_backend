# SAFE-GIFT LOCAL DEVELOPMENT ONLY (SPEC SECTION 22.2). Never a deployment artifact.
# Reads .env (git-ignored). Ports bind to 127.0.0.1 so nothing is exposed to the LAN.

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-safegift}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-changeme}"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional pooling path; enable with: docker compose --profile full up
  pgbouncer:
    image: edoburu/pgbouncer:latest
    profiles: ["full"]
    environment:
      DB_HOST: db
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${POSTGRES_DB:-safegift}
      POOL_MODE: transaction
    ports:
      - "127.0.0.1:6432:5432"
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    env_file: .env
    environment:
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./app:/app/app
    # The deploy Dockerfile CMD is gunicorn; compose overrides it for hot reload.
    command: ["uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  worker:
    build: .
    env_file: .env
    environment:
      ENVIRONMENT: development
    depends_on:
      redis:
        condition: service_healthy
    command: ["taskiq", "worker", "app.workers.broker:broker"]

volumes:
  pgdata:
  redisdata:
